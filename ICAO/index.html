<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ICAO英语900句练习</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0d2b4e 0%, #123a63 100%);
      color: #12243a;
      min-height: 100vh;
      line-height: 1.6;
    }
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 14px;
      padding: 30px 24px 26px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }
    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #0d2b4e;
      padding-bottom: 8px;
      border-bottom: 3px solid #1f6feb;
      display: inline-block;
    }
    .title-wrap {
      text-align: center;
      margin-bottom: 22px;
    }

    /* —— 微信小程序区域 —— */
    .mini-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .mini-icon {
      display: inline-block;
      text-decoration: none;
    }
    .mini-icon .icon-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .mini-icon img {
      width: 132px;
      height: 132px;
      border-radius: 26px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      transition: transform 0.18s ease;
      object-fit: contain;
      background: #fff;
    }
    .mini-icon:hover img {
      transform: scale(1.05);
    }
    .mini-name {
      font-size: 22px;
      font-weight: 700;
      color: #0d2b4e;
    }
    .mini-badge {
      display: inline-block;
      background: rgba(31, 111, 235, 0.12);
      color: #1f5dc0;
      border: 1px solid rgba(31, 111, 235, 0.35);
      font-size: 13px;
      padding: 3px 12px;
      border-radius: 999px;
      margin-top: 4px;
    }
    .hint {
      max-width: 640px;
      margin: 4px auto 0;
      font-size: 16px;
      color: #44566c;
      text-align: center;
    }

    /* —— 分区标题 —— */
    .section-title {
      margin: 30px 0 16px;
      font-size: 21px;
      font-weight: 700;
      color: #0d2b4e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::before {
      content: "";
      width: 6px;
      height: 22px;
      border-radius: 3px;
      background: #1f6feb;
      display: inline-block;
    }

    /* —— 下载区 —— */
    .downloads {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dl-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      background: #f4f7fb;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .dl-name {
      font-size: 17px;
      font-weight: 600;
      color: #20344c;
      word-break: break-all;
    }
    .dl-size {
      font-size: 13px;
      color: #8494a8;
      margin-left: 8px;
      white-space: nowrap;
    }
    .dl-btn {
      display: inline-block;
      background: #1f6feb;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 8px;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .dl-btn:hover {
      background: #1658c0;
    }

    /* —— 截屏：宽屏左右并排，窄屏(手机)上下堆叠 —— */
    .shots {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .shots figure {
      flex: 1 1 0;
      min-width: 0;
      background: #f4f7fb;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
    }
    .shots img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      background: #fff;
    }
    .shots figcaption {
      text-align: center;
      font-size: 14px;
      color: #8494a8;
      padding-top: 8px;
    }
    @media (max-width: 640px) {
      .shots {
        flex-direction: column;
      }
      .shots figure {
        flex: none;
        width: 100%;
      }
    }

    /* —— 版权 —— */
    footer {
      text-align: center;
      color: #bbd2ea;
      font-size: 14px;
      margin-top: 18px;
      padding: 6px 0 10px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="title-wrap">
        <h1>ICAO英语900句练习</h1>
      </div>

      <!-- 微信小程序图标 -->
      <div class="mini-wrapper">
        <a class="mini-icon" href="https://wxaurl.cn/OjwQr7jnglp" target="_blank"
          rel="noopener noreferrer">
          <span class="icon-box">
            <img src="../PEPEC_Learning/img/ICAO.png" alt="飞行学员工具箱 · 微信小程序" loading="lazy">
            <span class="mini-name">飞行学员工具箱</span>
            <span class="mini-badge">微信小程序</span>
          </span>
        </a>
        <p class="hint">
          提示：点击上方图标跳转到微信打开<br>
          进入「飞行学员工具箱」小程序后，点击进入<strong> ICAO英语练习 </strong>页面即可使用本页 ICAO 英语 900 句内容进行练习。
        </p>
      </div>

      <!-- 文件下载 -->
      <div class="section-title">文件下载</div>
      <div class="downloads">
        <div class="dl-item">
          <span class="dl-name">中国民航飞行员英语考试900句201709v.pdf
            <span class="dl-size">(PDF)</span>
          </span>
          <a class="dl-btn" href="中国民航飞行员英语考试900句201709v.pdf" download>下载</a>
        </div>
        <div class="dl-item">
          <span class="dl-name">排序版.pdf
            <span class="dl-size">(PDF)</span>
          </span>
          <a class="dl-btn" href="排序版.pdf" download>下载</a>
        </div>
      </div>

      <!-- 页面截图：屏幕足够宽则左右并排，屏幕较窄（手机）则上下堆叠 -->
      <div class="section-title">页面截图</div>
      <div class="shots">
        <figure>
          <img src="1.jpeg" alt="截图1" loading="lazy">
          <figcaption>截图 1</figcaption>
        </figure>
        <figure>
          <img src="2.jpeg" alt="截图2" loading="lazy">
          <figcaption>截图 2</figcaption>
        </figure>
      </div>

    </div>

    <footer>
      © 2022-2026 庞玺桐 版权所有
    </footer>
  </div>
</body>
</html>
